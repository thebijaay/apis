<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | thebijay API Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo"><a href="index.html">thebijay API Hub</a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="marketplace.html">APIs</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <a href="marketplace.html" class="btn btn-primary">Start Building</a>
        </nav>
    </header>

    <main class="container">
        <section class="contact">
            <h1>Contact Us</h1>
            <p>We're here to help. Reach out to thebijay API Hub team for any inquiries.</p>
            <div class="contact-container">
                <div class="contact-form">
                    <form onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-secondary">Send Message</button>
                    </form>
                </div>
                <div class="contact-info">
                    <h3>Our Details</h3>
                    <p><strong>Support:</strong> support@thebijay.com</p>
                    <p><strong>Sales:</strong> sales@thebijay.com</p>
                    <p><strong>GitHub:</strong> github.com/thebijay</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 thebijay API Hub. All rights reserved.
            </div>
        </div>
    </footer>
</body>
</html>
