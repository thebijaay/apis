<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | thebijay API Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="section-card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">
        <h1 style="margin-bottom: 30px;">Login to thebijay Hub</h1>
        <form onsubmit="event.preventDefault(); window.location.href='admin.html'">
            <div class="form-group text-left">
                <label for="email">Email</label>
                <input type="email" id="email" value="admin@thebijay.com" required>
            </div>
            <div class="form-group text-left">
                <label for="password">Password</label>
                <input type="password" id="password" value="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Login</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="#" style="color: var(--primary);">Sign up</a>
        </p>
    </div>
</body>
</html>
